# Fetch artifacts of a (possibly still running) experiment run and commit them to actions/results/<run_id>/.
# Trigger: push a change to actions/fetch.json = {"run_id": "...", "nonce": ...}
name: fetch
on:
  push:
    branches: ["arena/**"]
    paths: ["actions/fetch.json"]
permissions:
  contents: write
  actions: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          RID=$(python3 -c 'import json;print(json.load(open("actions/fetch.json"))["run_id"])')
          mkdir -p actions/results/$RID
          gh run download $RID -D actions/results/$RID || true
          # flatten artifact dirs
          find actions/results/$RID -mindepth 2 -name '*.log' -exec mv -f {} actions/results/$RID/ \; ; find actions/results/$RID -mindepth 1 -type d -empty -delete
          git config user.name actions-runner; git config user.email actions@users.noreply.github.com
          git add actions/results && (git commit -qm "partial results $RID [skip ci]" || echo nothing)
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep 10; done
        env:
          GH_TOKEN: ${{ github.token }}
