# Experiment fan-out. Trigger: push a change to actions/jobs.json on this branch
# (workflow_dispatch is unavailable: the workflow is not on the default branch and
# the sandbox token has no Actions scope). One ubuntu runner (4 CPU/16 GB) per entry.
# Fetch: gh run list --workflow=experiment.yml ; gh run download <id> -D actions/out
name: experiment
on:
  push:
    branches: ["arena/**"]
    paths: ["actions/jobs.json"]
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      script: ${{ steps.p.outputs.script }}
      jobs: ${{ steps.p.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          echo "script=$(python3 -c 'import json;print(json.load(open("actions/jobs.json"))["script"])')" >> $GITHUB_OUTPUT
          echo "jobs=$(python3 -c 'import json;print(json.dumps(json.load(open("actions/jobs.json"))["jobs"]))')" >> $GITHUB_OUTPUT
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q torch numpy --index-url https://download.pytorch.org/whl/cpu
      - name: run
        run: |
          python ${{ needs.plan.outputs.script }} ${{ matrix.job.args }} --threads 4 > "run_${{ matrix.job.tag }}.log" 2>&1 || true
          tail -n 30 "run_${{ matrix.job.tag }}.log"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.job.tag }}
          path: run_${{ matrix.job.tag }}.log
